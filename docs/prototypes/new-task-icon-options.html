<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 5v14M5 12h14' fill='none' stroke='%231769d2' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <title>DeepCreator · 新建任务图标选型</title>
  <style>
    @font-face {
      font-family: "Alibaba PuHuiTi 3";
      src: url("../../src/assets/fonts/AlibabaPuHuiTi-3-45-Light.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: "Alibaba PuHuiTi 3";
      src: url("../../src/assets/fonts/AlibabaPuHuiTi-3-65-Medium.woff2") format("woff2");
      font-style: normal;
      font-weight: 600;
      font-display: swap;
    }

    :root {
      color-scheme: light;
      --canvas: #f4f7f8;
      --surface: #ffffff;
      --sidebar: #f1f5f6;
      --row-hover: #e7eef2;
      --row-selected: #e3f1fb;
      --text: #243037;
      --muted: #6f7c84;
      --subtle: #929da3;
      --accent: #1769d2;
      --stroke: rgba(45, 60, 68, .11);
      --shadow: 0 16px 44px rgba(37, 52, 60, .12), 0 2px 8px rgba(37, 52, 60, .05);
      --font-ui: "Alibaba PuHuiTi 3", "Microsoft YaHei UI", "PingFang SC", sans-serif;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --canvas: #171c1f;
      --surface: #22292d;
      --sidebar: #1c2225;
      --row-hover: #303a40;
      --row-selected: #243f52;
      --text: #eef2f4;
      --muted: #b4c0c6;
      --subtle: #94a2a9;
      --accent: #67b6ee;
      --stroke: rgba(229, 238, 242, .10);
      --shadow: 0 20px 54px rgba(0, 0, 0, .35);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: var(--canvas);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 400;
    }

    button { font: inherit; color: inherit; }

    button:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 70%, transparent);
      outline-offset: 2px;
    }

    .page {
      width: min(1180px, calc(100% - 48px));
      margin: 0 auto;
      padding: 48px 0 56px;
    }

    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -.02em;
    }

    .intro {
      max-width: 620px;
      margin: 7px 0 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .theme-toggle {
      display: inline-flex;
      height: 34px;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border: 0;
      border-radius: 17px;
      background: var(--surface);
      box-shadow: inset 0 0 0 1px var(--stroke);
      color: var(--muted);
      cursor: pointer;
    }

    .theme-toggle:hover { background: var(--row-hover); color: var(--text); }

    .theme-toggle svg,
    .icon-svg {
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .board {
      display: grid;
      grid-template-columns: minmax(360px, .9fr) minmax(460px, 1.35fr);
      min-height: 650px;
      overflow: hidden;
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow), inset 0 0 0 1px var(--stroke);
    }

    .sidebar-preview {
      min-width: 0;
      padding: 22px 14px;
      background: var(--sidebar);
      box-shadow: 1px 0 0 var(--stroke);
    }

    .sidebar-heading {
      margin: 0 10px 10px;
      color: var(--subtle);
      font-size: 12px;
      font-weight: 500;
    }

    .candidate-list { display: grid; gap: 3px; }

    .candidate {
      display: grid;
      width: 100%;
      min-width: 0;
      grid-template-columns: minmax(0, 1fr) 30px;
      align-items: center;
      min-height: 48px;
      padding: 0 9px 0 12px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }

    .candidate:hover { background: var(--row-hover); }
    .candidate.is-selected { background: var(--row-selected); }

    .candidate-copy { min-width: 0; }

    .candidate-title {
      display: flex;
      min-width: 0;
      align-items: baseline;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
    }

    .candidate-title span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .candidate-index {
      flex: none;
      color: var(--subtle);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      font-weight: 400;
    }

    .candidate-description {
      overflow: hidden;
      margin-top: 2px;
      color: var(--subtle);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .candidate-action {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 8px;
      color: var(--muted);
      opacity: .18;
      transition: background 140ms ease, color 140ms ease, opacity 140ms ease;
    }

    .candidate:hover .candidate-action,
    .candidate:focus-visible .candidate-action,
    .candidate.is-selected .candidate-action { opacity: 1; }

    .candidate:hover .candidate-action { background: color-mix(in srgb, var(--surface) 66%, transparent); }
    .candidate.is-selected .candidate-action { color: var(--accent); }

    .detail {
      display: grid;
      min-width: 0;
      grid-template-rows: auto auto 1fr auto;
      padding: 34px 38px 30px;
    }

    .detail-kicker {
      color: var(--subtle);
      font-size: 11px;
      font-weight: 500;
    }

    .detail-title {
      margin: 8px 0 0;
      font-size: 20px;
      font-weight: 600;
    }

    .detail-description {
      max-width: 540px;
      margin: 6px 0 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .icon-stage {
      display: grid;
      min-height: 330px;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 18px;
      padding: 30px 0;
    }

    .scale-sample {
      display: grid;
      min-height: 210px;
      place-items: center;
      align-content: center;
      gap: 18px;
      border-radius: 14px;
      background: color-mix(in srgb, var(--sidebar) 72%, transparent);
    }

    .scale-sample strong { color: var(--subtle); font-size: 11px; font-weight: 500; }

    .sample-button {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      border-radius: 10px;
      background: var(--row-hover);
      color: var(--text);
    }

    .sample-button.large { width: 88px; height: 88px; border-radius: 16px; }

    .notes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .note {
      min-width: 0;
      padding: 12px 13px;
      border-radius: 10px;
      background: var(--sidebar);
    }

    .note span { display: block; color: var(--subtle); font-size: 10px; }
    .note strong { display: block; margin-top: 3px; font-size: 12px; font-weight: 500; }

    @media (max-width: 820px) {
      .page { width: min(100% - 24px, 620px); padding-top: 24px; }
      .page-header { align-items: flex-start; }
      .board { grid-template-columns: 1fr; }
      .sidebar-preview { box-shadow: 0 1px 0 var(--stroke); }
      .detail { padding: 28px 22px 24px; }
    }

    @media (max-width: 520px) {
      .page-header { display: grid; }
      .board { border-radius: 14px; }
      .icon-stage { grid-template-columns: 1fr; }
      .notes { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <div>
        <p class="eyebrow">Sidebar icon study</p>
        <h1>新建任务图标选型</h1>
        <p class="intro">候选均按侧边栏真实的 16px 尺寸绘制。悬浮左侧任务集标题查看按钮出现效果，点击任意一项锁定并查看放大结构。</p>
      </div>
      <button class="theme-toggle" id="theme-toggle" type="button">
        <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" stroke-width="1.7">
          <path d="M12 3a9 9 0 1 0 9 9c0-.5-.04-1-.12-1.47A7 7 0 0 1 12 3Z" />
        </svg>
        <span>切换主题</span>
      </button>
    </header>

    <section class="board">
      <aside class="sidebar-preview">
        <p class="sidebar-heading">任务集</p>
        <div class="candidate-list" id="candidate-list"></div>
      </aside>

      <section class="detail" aria-live="polite">
        <div>
          <div class="detail-kicker" id="detail-kicker">方案 01 / 08</div>
          <h2 class="detail-title" id="detail-title">极简加号</h2>
          <p class="detail-description" id="detail-description">最轻量、最直接，适合标题行已经明确表达任务集语境的情况。</p>
        </div>
        <div class="icon-stage">
          <div class="scale-sample">
            <div class="sample-button" id="small-sample"></div>
            <strong>真实尺寸 · 16px</strong>
          </div>
          <div class="scale-sample">
            <div class="sample-button large" id="large-sample"></div>
            <strong>结构放大 · 40px</strong>
          </div>
        </div>
        <div></div>
        <div class="notes">
          <div class="note"><span>识别速度</span><strong id="note-recognition">最快</strong></div>
          <div class="note"><span>视觉重量</span><strong id="note-weight">最轻</strong></div>
          <div class="note"><span>语义侧重</span><strong id="note-meaning">纯新建</strong></div>
        </div>
      </section>
    </section>
  </main>

  <script>
    const icons = [
      {
        id: "plus",
        title: "极简加号",
        description: "不重复任务语义，最安静",
        detail: "最轻量、最直接，适合标题行已经明确表达任务集语境的情况。",
        recognition: "最快",
        weight: "最轻",
        meaning: "纯新建",
        paths: '<path d="M12 5v14M5 12h14" />'
      },
      {
        id: "plus-ring",
        title: "圆环加号",
        description: "更像可点击操作入口",
        detail: "用开放圆环包住加号，按钮感更明确，同时保持线性图标的克制。",
        recognition: "很快",
        weight: "轻",
        meaning: "新增入口",
        paths: '<circle cx="12" cy="12" r="8" /><path d="M12 8.5v7M8.5 12h7" />'
      },
      {
        id: "task-plus",
        title: "任务框加号",
        description: "最接近“新建任务”",
        detail: "方形任务容器与右上加号组合，语义最完整，但在 16px 下视觉重量略高。",
        recognition: "很快",
        weight: "中等",
        meaning: "新建任务",
        paths: '<path d="M11 5H6.8A2.8 2.8 0 0 0 4 7.8v9.4A2.8 2.8 0 0 0 6.8 20h9.4a2.8 2.8 0 0 0 2.8-2.8V13" /><path d="M17 4v6M14 7h6" />'
      },
      {
        id: "document-plus",
        title: "文档加号",
        description: "强调创建一个新对象",
        detail: "折角文档提供“新建内容”的常见心智模型，适合任务更接近独立工作文档时。",
        recognition: "稳定",
        weight: "中等",
        meaning: "新建内容",
        paths: '<path d="M6 3.8h7l5 5v11.4H6Z" /><path d="M13 3.8v5h5M12 12v5M9.5 14.5h5" />'
      },
      {
        id: "chat-plus",
        title: "对话加号",
        description: "强调开始新的 Agent 对话",
        detail: "气泡轮廓强化 DeepCreator 的对话属性，适合把“任务”理解为一段新的 Agent 会话。",
        recognition: "稳定",
        weight: "中等",
        meaning: "新建对话",
        paths: '<path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 9.2 9.2 0 0 1-3.5-.7L4 20l1.5-4A7.5 7.5 0 1 1 20 11.5Z" /><path d="M12 8v7M8.5 11.5h7" />'
      },
      {
        id: "branch-plus",
        title: "分叉加号",
        description: "强调从任务集派生新任务",
        detail: "用分支节点表达从当前项目派生一条新任务，产品语义独特，但初次识别成本稍高。",
        recognition: "一般",
        weight: "中等",
        meaning: "派生任务",
        paths: '<circle cx="6" cy="5" r="2" /><circle cx="6" cy="19" r="2" /><path d="M6 7v5a4 4 0 0 0 4 4h2M6 17V9a4 4 0 0 1 4-4h2M17 5v6M14 8h6" />'
      },
      {
        id: "compose",
        title: "编辑新建",
        description: "铅笔与方框对角线重合",
        detail: "保留“方框 + 笔”的表达，并将铅笔向左收进方框，使笔身稳定落在右上—左下对角线上。",
        recognition: "稳定",
        weight: "偏重",
        meaning: "撰写任务",
        paths: '<path d="M12 4H6.8A2.8 2.8 0 0 0 4 6.8v10.4A2.8 2.8 0 0 0 6.8 20h10.4a2.8 2.8 0 0 0 2.8-2.8V12" /><path d="m8.55 13.15 7.7-7.7a1.65 1.65 0 0 1 2.35 2.35l-7.7 7.7-3.15.85.8-3.2Z" />'
      },
      {
        id: "spark-plus",
        title: "星芒加号",
        description: "带一点 Agent 生成感",
        detail: "主加号配一个小星点，既保留新建识别，也轻微体现 AI Agent 的生成属性。",
        recognition: "很快",
        weight: "轻",
        meaning: "智能新建",
        paths: '<path d="M11 6v12M5 12h12" /><path d="m18.5 4 .45 1.05L20 5.5l-1.05.45L18.5 7l-.45-1.05L17 5.5l1.05-.45Z" />'
      }
    ];

    const list = document.querySelector("#candidate-list");
    const detailKicker = document.querySelector("#detail-kicker");
    const detailTitle = document.querySelector("#detail-title");
    const detailDescription = document.querySelector("#detail-description");
    const smallSample = document.querySelector("#small-sample");
    const largeSample = document.querySelector("#large-sample");
    const noteRecognition = document.querySelector("#note-recognition");
    const noteWeight = document.querySelector("#note-weight");
    const noteMeaning = document.querySelector("#note-meaning");

    function iconMarkup(icon, size) {
      return `<svg class="icon-svg" aria-hidden="true" width="${size}" height="${size}" viewBox="0 0 24 24" stroke-width="1.65">${icon.paths}</svg>`;
    }

    function selectIcon(index) {
      const icon = icons[index];
      document.querySelectorAll(".candidate").forEach((button, buttonIndex) => {
        button.classList.toggle("is-selected", buttonIndex === index);
        button.setAttribute("aria-pressed", String(buttonIndex === index));
      });
      detailKicker.textContent = `方案 ${String(index + 1).padStart(2, "0")} / ${String(icons.length).padStart(2, "0")}`;
      detailTitle.textContent = icon.title;
      detailDescription.textContent = icon.detail;
      smallSample.innerHTML = iconMarkup(icon, 16);
      largeSample.innerHTML = iconMarkup(icon, 40);
      noteRecognition.textContent = icon.recognition;
      noteWeight.textContent = icon.weight;
      noteMeaning.textContent = icon.meaning;
    }

    icons.forEach((icon, index) => {
      const button = document.createElement("button");
      button.className = "candidate";
      button.type = "button";
      button.setAttribute("aria-pressed", "false");
      button.innerHTML = `
        <span class="candidate-copy">
          <span class="candidate-title"><span>${icon.title}</span><span class="candidate-index">${String(index + 1).padStart(2, "0")}</span></span>
          <span class="candidate-description">${icon.description}</span>
        </span>
        <span class="candidate-action">${iconMarkup(icon, 16)}</span>
      `;
      button.addEventListener("click", () => selectIcon(index));
      list.append(button);
    });

    document.querySelector("#theme-toggle").addEventListener("click", () => {
      const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = nextTheme;
    });

    selectIcon(6);
  </script>
</body>
</html>

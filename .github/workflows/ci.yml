name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_TEST_DATABASE_URL: postgresql://deepcreator:deepcreator_test@127.0.0.1:5432/deepcreator_auth_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: deepcreator_auth_test
          POSTGRES_PASSWORD: deepcreator_test
          POSTGRES_USER: deepcreator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deepcreator -d deepcreator_auth_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run audit:prod
      - run: npm run typecheck
      - run: npm run test:architecture
      - run: npm test
      - run: npm run build
